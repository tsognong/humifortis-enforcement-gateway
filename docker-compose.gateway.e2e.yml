services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [gateway-gate-redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  gateway:
    build: .
    environment:
      PORT: "8081"
      HUMIFORTIS_URL: ${HUMIFORTIS_URL:-http://host.docker.internal:8080/api/v1}
      # the key of the gateway: it needs the scope aauth:verify to read the agent providers and to write agent:aauth: identities
      HUMIFORTIS_API_KEY: ${HUMIFORTIS_API_KEY:-hf_e2e_aauth_gateway_2026}
      HUMIFORTIS_TIMEOUT: 100ms
      HUMIFORTIS_FAIL_POLICY: fail_closed
      REDIS_URL: redis://redis:6379
      AAUTH_ENABLED: "true"
      AAUTH_TENANT_ID: ${CAEP_TENANT_ID:-d4f7a2c1-8b3e-4f6a-9c1d-2e5f8a7b3c4d}
      AAUTH_PROVIDERS_REFRESH: 2s
      # lab provider: a private address and a certificate of its own, never in production
      AAUTH_ALLOW_PRIVATE_NETWORKS: "true"
      AAUTH_ROOT_CAS_FILE: /lab/provider.crt
      STATE_TTL: 5m
      DECISION_CACHE_TTL: 5s
      GATEWAY_TRUSTED_PROXY_CIDRS: 0.0.0.0/0,::/0
      CAEP_ISSUER: ${CAEP_ISSUER:-http://localhost:8080/tenants/d4f7a2c1-8b3e-4f6a-9c1d-2e5f8a7b3c4d}
      CAEP_AUDIENCE: ${CAEP_AUDIENCE:-http://host.docker.internal:18081/ssf/caep/events}
      CAEP_TENANT_ID: ${CAEP_TENANT_ID:-d4f7a2c1-8b3e-4f6a-9c1d-2e5f8a7b3c4d}
      CAEP_JWKS_URL: ${CAEP_JWKS_URL:-http://host.docker.internal:8080/.well-known/jwks.json}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./e2e/aauth/lab/provider.crt:/lab/provider.crt:ro"]
    depends_on:
      agent-provider:
        condition: service_started
      redis:
        condition: service_healthy
    ports: ["18081:8081"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 3s
      timeout: 2s
      retries: 15

  # an agent provider as a customer would run one: its metadata and keys over HTTPS, at a name of its own
  agent-provider:
    image: nginx:1.27-alpine
    networks:
      default:
        aliases: [agents.lab.test]
    volumes:
      - ./e2e/aauth/provider/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./e2e/aauth/provider/www:/www:ro
      - ./e2e/aauth/lab:/lab:ro

  demo:
    build: ./e2e/demo

  nginx:
    image: nginx:1.27-alpine
    ports: ["18080:8080"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      gateway:
        condition: service_healthy
      demo:
        condition: service_started

volumes:
  gateway-gate-redis: