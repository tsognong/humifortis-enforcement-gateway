events {}

http {
  upstream gateway { server gateway:8081; }
  upstream protected_app { server demo:80; }

  server {
    listen 8080;

    location = /_humifortis_auth {
      internal;
      proxy_pass http://gateway/auth;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Tenant-ID $http_x_tenant_id;
      proxy_set_header X-Subject $http_x_subject;
      proxy_set_header X-Session-ID $http_x_session_id;
      proxy_set_header X-Device-ID $http_x_device_id;
      proxy_set_header X-Auth-Method $http_x_auth_method;
      proxy_set_header X-Auth-Assurance $http_x_auth_assurance;
      proxy_set_header X-Humifortis-Trusted-Context $http_x_humifortis_trusted_context;
    }

    location / {
      auth_request /_humifortis_auth;
      auth_request_set $decision $upstream_http_x_humifortis_decision;
      auth_request_set $decision_id $upstream_http_x_humifortis_decision_id;
      auth_request_set $challenge_id $upstream_http_x_humifortis_challenge_id;
      auth_request_set $required_assurance $upstream_http_x_humifortis_required_assurance;
      add_header X-Humifortis-Decision $decision always;
      add_header X-Humifortis-Decision-ID $decision_id always;
      add_header X-Humifortis-Challenge-ID $challenge_id always;
      add_header X-Humifortis-Required-Assurance $required_assurance always;
      proxy_set_header X-Humifortis-Decision $decision;
      proxy_set_header X-Original-URI $request_uri;
      proxy_pass http://protected_app;
    }
  }
}