events {}

http {
  upstream gateway { server gateway:8081; }
  upstream protected_app { server demo:80; }

  server {
    listen 8080;

    location = /_humifortis_auth {
      internal;
      proxy_pass http://gateway/auth;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Original-Host $http_host;
      proxy_set_header X-Original-Scheme $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      # an AAuth proof is judged by the gateway alone: the signature fields travel, the client never speaks for the tenant
      proxy_set_header Signature $http_signature;
      proxy_set_header Signature-Input $http_signature_input;
      proxy_set_header Signature-Key $http_signature_key;
      proxy_set_header Content-Digest $http_content_digest;
      proxy_set_header X-Tenant-ID $http_x_tenant_id;
      proxy_set_header X-Subject $http_x_subject;
      proxy_set_header X-Session-ID $http_x_session_id;
      proxy_set_header X-Device-ID $http_x_device_id;
      proxy_set_header X-Auth-Method $http_x_auth_method;
      proxy_set_header X-Auth-Assurance $http_x_auth_assurance;
      proxy_set_header X-Humifortis-Trusted-Context $http_x_humifortis_trusted_context;
    }

    location / {
      auth_request /_humifortis_auth;
      auth_request_set $decision $upstream_http_x_humifortis_decision;
      auth_request_set $decision_id $upstream_http_x_humifortis_decision_id;
      auth_request_set $challenge_id $upstream_http_x_humifortis_challenge_id;
      auth_request_set $required_assurance $upstream_http_x_humifortis_required_assurance;
      auth_request_set $agent_id $upstream_http_x_agent_id;
      auth_request_set $agent_issuer $upstream_http_x_agent_issuer;
      auth_request_set $agent_jkt $upstream_http_x_agent_key_jkt;
      auth_request_set $signature_error $upstream_http_signature_error;
      add_header X-Humifortis-Decision $decision always;
      add_header X-Humifortis-Decision-ID $decision_id always;
      add_header X-Humifortis-Challenge-ID $challenge_id always;
      add_header X-Humifortis-Required-Assurance $required_assurance always;
      add_header Signature-Error $signature_error always;
      proxy_set_header X-Humifortis-Decision $decision;
      # what the upstream may rely on is what the gateway verified, never what the client sent
      proxy_set_header X-Agent-Id $agent_id;
      proxy_set_header X-Agent-Issuer $agent_issuer;
      proxy_set_header X-Agent-Key-Jkt $agent_jkt;
      proxy_set_header Signature "";
      proxy_set_header Signature-Input "";
      proxy_set_header Signature-Key "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_pass http://protected_app;
    }
  }
}