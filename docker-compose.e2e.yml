services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [gateway-redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  humifortis-core:
    image: ${HUMIFORTIS_CORE_IMAGE:-humifortis-core:e2e}
    environment:
      PORT: "8080"
      ENV: development
      REDIS_URL: redis://redis:6379
      DATABASE_URL: ${HUMIFORTIS_DATABASE_URL:-postgres://humifortis:humifortis_dev@host.docker.internal:5432/humifortis?sslmode=disable}
      HUMIFORTIS_MODE: standalone
      MULTI_TENANT: "false"
      JWT_SECRET: ${HUMIFORTIS_JWT_SECRET:-change-me-in-e2e}
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  gateway:
    build: .
    environment:
      PORT: "8081"
      ENV: development
      HUMIFORTIS_URL: http://humifortis-core:8080/api/v1
      HUMIFORTIS_API_KEY: ${HUMIFORTIS_API_KEY:-}
      HUMIFORTIS_TIMEOUT: 100ms
      HUMIFORTIS_FAIL_POLICY: ${HUMIFORTIS_FAIL_POLICY:-fail_closed}
      REDIS_URL: redis://redis:6379
      STATE_TTL: 5m
      DECISION_CACHE_TTL: 5s
      GATEWAY_TRUSTED_PROXY_CIDRS: 0.0.0.0/0,::/0
      CAEP_ISSUER: ${CAEP_ISSUER:-}
      CAEP_AUDIENCE: ${CAEP_AUDIENCE:-humifortis-enforcement-gateway}
      CAEP_TENANT_ID: ${CAEP_TENANT_ID:-demo-tenant}
      CAEP_JWKS_URL: ${CAEP_JWKS_URL:-http://host.docker.internal:8080/.well-known/jwks.json}
      CAEP_PUBLIC_KEY_PEM: ${CAEP_PUBLIC_KEY_PEM:-}
    depends_on:
      humifortis-core:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 15

  demo:
    build: ./e2e/demo

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:8080"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      gateway:
        condition: service_healthy
      demo:
        condition: service_started

volumes:
  gateway-redis: